# Plattformsteamet applicerar denna fil en gång.
# Byt CHANGE_ME_NAMESPACE mot botens namespace överallt.
# Byt CHANGE_ME_SCAN_NAMESPACE mot ett godkänt app-namespace.
# För flera app-namespaces: kopiera de två sista dokumenten (Role + RoleBinding)
# och ange ett app-namespace per par.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cvebridge-CHANGE_ME_NAMESPACE
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cvebridge-CHANGE_ME_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cvebridge-CHANGE_ME_NAMESPACE
subjects:
  - kind: ServiceAccount
    name: cvebridge
    namespace: CHANGE_ME_NAMESPACE
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cvebridge-reporter-CHANGE_ME_NAMESPACE
  namespace: CHANGE_ME_SCAN_NAMESPACE
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cvebridge-reporter-CHANGE_ME_NAMESPACE
  namespace: CHANGE_ME_SCAN_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cvebridge-reporter-CHANGE_ME_NAMESPACE
subjects:
  - kind: ServiceAccount
    name: cvebridge-reporter
    namespace: CHANGE_ME_NAMESPACE
