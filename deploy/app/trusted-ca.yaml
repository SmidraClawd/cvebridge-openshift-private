# OpenShift fyller automatiskt denna separata ConfigMap med klustrets CA-paket.
# Lägg aldrig injiceringsetiketten på cvebridge-config: dess inställningar raderas då.
# Företagets CA för Mattermost/ACS måste ingå i klustrets betrodda paket.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cvebridge-trusted-ca
  labels:
    config.openshift.io/inject-trusted-cabundle: "true"
data: {}
