# Fyll i företagets adresser, driftkanalens ID och app-namespaces här.
# Tokenvärden fylls i separat i secret.yaml. Ingen .env behövs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cvebridge-config
data:
  # Projekten där apparna finns. Namespace-namn skiljs med kommatecken.
  SCAN_NAMESPACES: "team-a"

  # Vanliga HTTPS-serveradresser. Boten lägger till /api/v4 respektive /v1.
  # INTERNAL är ett äldre variabelnamn; Mattermost-adressen får vara extern.
  MATTERMOST_INTERNAL_URL: "https://mattermost.CHANGE_ME_DOMAIN"
  STACKROX_URL: "https://central.CHANGE_ME_DOMAIN"
  STACKROX_CLUSTER_ID: "CHANGE_ME_CLUSTER_ID"

  # En privat driftkanal. Bjud in driften och boten; ingen användarmappning behövs.
  MATTERMOST_CHANNEL_ID: "CHANGE_ME_CHANNEL_ID"

  # Botens egen callback-adress. Samma värdnamn som i botens Route.
  MATTERMOST_DIALOG_URL: "https://cvebridge.CHANGE_ME_DOMAIN/slash/cve/dialog"

  # Valfritt: privat driftkanal för daglig databasstatus och fellarm.
  # DATABASE_MONITOR_CHANNEL_ID: "CHANGE_ME_DRIFT_CHANNEL_ID"

  # Standardvärden som normalt kan behållas.
  ACCESS_MODE: operations
  LISTEN_ADDR: ":8001"
  STATE_FILE: /data/requests.sqlite3
  # OpenShift fyller trusted-ca.yaml; Deployment monterar paketet på /ca.
  MATTERMOST_CA_FILE: /ca/ca-bundle.crt
  STACKROX_CA_FILE: /ca/ca-bundle.crt
  STACKROX_SCANNER_COMPONENT: SCANNER_V4
  SCHEDULE_DEFAULT_TIMEZONE: Europe/Stockholm
  DATABASE_MAX_AGE_HOURS: "24"
  CVE_ALERTS_ENABLED: "true"
  CVE_ALERT_MIN_CVSS: "9"
  CVE_ALERT_FIRST_REPORT: "false"
