name: Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    env:
      GOPROXY: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: go test -mod=vendor -race ./...
      - run: go vet -mod=vendor ./...
      - name: Build executable and image from source
        run: docker build --platform linux/amd64 --network=none -t cvebridge:ci .
      - run: docker run --rm cvebridge:ci version
