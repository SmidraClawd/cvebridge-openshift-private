name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile app/server.py app/scheduling.py app/dialogs.py scripts/company.py scripts/verify_scheduling.py scripts/platform.py scripts/verify.py scripts/helm_postrender.py
      - run: python scripts/platform.py render --config config/openshift.example.json > /tmp/deployment.json
      - run: python -c "import json; x=json.load(open('/tmp/deployment.json')); assert x['kind']=='List'; assert any(r['kind']=='Route' for r in x['items'])"
